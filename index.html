<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поймай квадрат</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1a2a3a, #0f1a24);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        .game-container {
            background: #1e2f3f;
            padding: 20px 30px 35px;
            border-radius: 48px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px 18px 6px;
            color: #bdd9e8;
            font-weight: 600;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 3px rgba(0,0,0,0.5);
        }

        .score-box {
            background: #0f1a22;
            padding: 6px 20px;
            border-radius: 40px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.08);
        }

        .score-box span {
            color: #f5d742;
            font-size: 1.7rem;
            font-weight: 700;
            margin-left: 6px;
        }

        .reset-btn {
            background: #2c4053;
            border: none;
            color: #e3f0fa;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 4px 18px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0f171f, 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.08s ease-in;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .reset-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #0f171f;
        }

        .reset-btn:hover {
            background: #3a546b;
            color: white;
        }

        .field {
            position: relative;
            width: 500px;
            height: 400px;
            background: #17232e;
            border-radius: 32px;
            box-shadow: inset 0 8px 14px rgba(0,0,0,0.7), 0 0 0 1px #3a5368;
            overflow: hidden;
            margin: 0 auto;
            cursor: crosshair;
        }

        .target {
            position: absolute;
            width: 70px;
            height: 70px;
            background: #f5b042;
            background: radial-gradient(circle at 30% 30%, #fcd47a, #e0922b);
            border-radius: 16px;
            box-shadow: 0 8px 0 #8f5f1a, 0 10px 20px rgba(0, 0, 0, 0.6);
            transition: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: rgba(0,0,0,0.2);
            text-shadow: 0 2px 0 rgba(255,255,255,0.2);
            will-change: transform;
        }

        .target:active {
            transform: scale(0.85);
            box-shadow: 0 3px 0 #8f5f1a;
        }

        .target.hidden {
            display: none;
        }

        .message {
            margin-top: 18px;
            font-size: 1.2rem;
            color: #b0ccdd;
            background: #14212b;
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-block;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
            font-weight: 500;
        }

        .message span {
            color: #f5d742;
            font-weight: 700;
        }

        @media (max-width: 560px) {
            .game-container { padding: 15px; }
            .field { width: 100%; height: 300px; }
            .target { width: 60px; height: 60px; border-radius: 14px; }
            .header { font-size: 1rem; flex-wrap: wrap; gap: 10px; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="score-box">🏆 <span id="scoreDisplay">0</span></div>
        <button class="reset-btn" id="resetButton">↺</button>
    </div>

    <div class="field" id="gameField">
        <div class="target hidden" id="target"></div>
    </div>

    <div class="message" id="statusMessage">Кликни по квадрату ✦</div>
</div>

<script>
    (function(){
        // ----- Элементы -----
        const field = document.getElementById('gameField');
        const target = document.getElementById('target');
        const scoreSpan = document.getElementById('scoreDisplay');
        const statusMsg = document.getElementById('statusMessage');

        // ----- Состояние -----
        let score = 0;
        let timeoutId = null;          // таймаут на исчезновение
        let spawnTimeoutId = null;     // таймаут на появление нового
        let isTargetVisible = false;
        let gameActive = true;         // при сбросе отключаем таймеры

        // ----- Вспомогательные функции -----
        function getFieldRect() {
            return field.getBoundingClientRect();
        }

        // Случайное число в диапазоне [min, max]
        function random(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Показать квадрат в случайном месте (с учётом размеров)
        function showTarget() {
            if (!gameActive) return;

            const fieldWidth = field.clientWidth;
            const fieldHeight = field.clientHeight;
            const targetSize = 70; // размер квадрата (px)

            // Максимальные координаты (чтобы не вылезал за края)
            const maxX = Math.max(0, fieldWidth - targetSize);
            const maxY = Math.max(0, fieldHeight - targetSize);

            // Если поле слишком маленькое – спрячем и выйдем
            if (maxX < 0 || maxY < 0) {
                target.classList.add('hidden');
                isTargetVisible = false;
                return;
            }

            const x = random(0, maxX);
            const y = random(0, maxY);

            target.style.left = x + 'px';
            target.style.top = y + 'px';
            target.classList.remove('hidden');
            isTargetVisible = true;

            // Обновляем сообщение
            statusMsg.innerHTML = '🎯 Лови!';

            // Отменяем старый таймаут, если был
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }

            // Таймаут: через 1.2 секунды квадрат исчезает, если не поймали
            timeoutId = setTimeout(() => {
                if (gameActive && isTargetVisible) {
                    target.classList.add('hidden');
                    isTargetVisible = false;
                    statusMsg.innerHTML = '😅 Мимо! Попробуй снова';
                    // Запускаем появление нового через небольшую задержку
                    scheduleNextSpawn(600);
                }
                timeoutId = null;
            }, 1200);
        }

        // Запланировать появление нового квадрата через задержку (мс)
        function scheduleNextSpawn(delay) {
            if (!gameActive) return;

            if (spawnTimeoutId) {
                clearTimeout(spawnTimeoutId);
                spawnTimeoutId = null;
            }

            spawnTimeoutId = setTimeout(() => {
                if (gameActive) {
                    showTarget();
                }
                spawnTimeoutId = null;
            }, delay);
        }

        // ----- Обработчик клика по квадрату -----
        function handleTargetClick(e) {
            e.stopPropagation(); // не даём всплыть до поля
            if (!gameActive) return;
            if (!isTargetVisible) return;

            // Увеличиваем счёт
            score++;
            scoreSpan.textContent = score;
            statusMsg.innerHTML = '✅ +1! Молодец!';

            // Прячем квадрат
            target.classList.add('hidden');
            isTargetVisible = false;

            // Отменяем таймаут исчезновения (квадрат уже пойман)
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }

            // Запускаем появление нового квадрата через 400–700 мс
            const delay = random(300, 700);
            scheduleNextSpawn(delay);
        }

        // ----- Сброс игры -----
        function resetGame() {
            // Останавливаем все таймеры
            gameActive = false;

            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }
            if (spawnTimeoutId) {
                clearTimeout(spawnTimeoutId);
                spawnTimeoutId = null;
            }

            // Сбрасываем состояние
            score = 0;
            scoreSpan.textContent = '0';
            target.classList.add('hidden');
            isTargetVisible = false;
            statusMsg.innerHTML = '🔄 Новая игра!';

            // Активируем игру снова
            gameActive = true;

            // Первый квадрат появляется через 400 мс
            scheduleNextSpawn(400);
        }

        // ----- Обработчик клика по полю (мимо квадрата) -----
        function handleFieldClick(e) {
            // Если кликнули по самому полю, а не по дочернему элементу (квадрату)
            if (e.target === field) {
                if (!gameActive) return;
                // Если квадрат виден, но кликнули мимо — ничего не делаем,
                // просто даём обратную связь (но не наказываем)
                if (isTargetVisible) {
                    statusMsg.innerHTML = '👀 Почти! Кликни по квадрату';
                } else {
                    statusMsg.innerHTML = '⏳ Жди появления...';
                }
            }
        }

        // ----- Инициализация и слушатели -----
        function init() {
            // Сброс по кнопке
            document.getElementById('resetButton').addEventListener('click', resetGame);

            // Клик по квадрату
            target.addEventListener('click', handleTargetClick);

            // Клик по полю (мимо)
            field.addEventListener('click', handleFieldClick);

            // Стартуем игру
            resetGame();
        }

        // Запуск после загрузки DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Дополнительно: при изменении размеров окна, если квадрат виден,
        // пересчитываем позицию, чтобы он не вылезал за края (опционально)
        // Для простоты – при ресайзе просто перезапускаем появление (щадящий вариант)
        let resizeTimeout;
        window.addEventListener('resize', function() {
            if (!gameActive) return;
            // Если квадрат виден – спрячем и покажем заново через небольшую задержку
            if (isTargetVisible) {
                // Отменяем текущие таймеры, чтобы не было конфликтов
                if (timeoutId) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
                if (spawnTimeoutId) {
                    clearTimeout(spawnTimeoutId);
                    spawnTimeoutId = null;
                }

                target.classList.add('hidden');
                isTargetVisible = false;
                statusMsg.innerHTML = '🔄 Подстраиваюсь...';

                // Показываем снова через 500 мс
                scheduleNextSpawn(500);
            }
        });

    })();
</script>
</body>
</html>
