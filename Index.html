<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ИИ Квест Mini App</title>
  <!-- 1. Подключаем SDK Telegram Mini Apps -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* Используем переменные темы Telegram, чтобы дизайн автоматически подстраивался под светлую/темную тему юзера */
    body { 
      background: var(--tg-theme-bg-color, #0f172a); 
      color: var(--tg-theme-text-color, #f8fafc); 
      margin: 0; 
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .chat-container { 
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px; 
      margin: 0 auto;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h2 { margin: 0; font-size: 1.2rem; color: var(--tg-theme-link-color, #38bdf8); }
    
    .btn-reset {
      background: transparent;
      border: 1px solid var(--tg-theme-hint-color, #475569);
      color: var(--tg-theme-hint-color, #94a3b8);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    #story-text { 
      font-size: 1rem; 
      line-height: 1.5; 
      margin-bottom: 20px; 
      min-height: 90px; 
      background: var(--tg-theme-secondary-bg-color, #1e293b); 
      padding: 16px; 
      border-radius: 12px; 
      border-left: 4px solid var(--tg-theme-button-color, #38bdf8); 
    }

    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    
    .btn-option { 
      background: var(--tg-theme-button-color, #0284c7); 
      color: var(--tg-theme-button-text-color, #ffffff); 
      border: none; 
      padding: 14px 16px; 
      border-radius: 12px; 
      font-size: 0.95rem; 
      font-weight: 500;
      cursor: pointer; 
      text-align: left; 
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .btn-option:active { transform: scale(0.98); opacity: 0.9; }
    .loader { text-align: center; color: var(--tg-theme-hint-color, #94a3b8); font-style: italic; padding: 20px; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <h2>ИИ Приключение</h2>
    <button class="btn-reset" onclick="resetStory()">Сначала</button>
  </div>
  <div id="story-text">Загрузка истории...</div>
  <div id="options-container" class="options-grid"></div>
</div>

<script>
  // Инициализация Telegram WebApp
  const tg = window.Telegram.WebApp;
  tg.expand(); // Разворачиваем приложение на весь экран

  // 🔑 Вставь сюда свой API Ключ Gemini
  const API_KEY = "AQ.Ab8RN6JAHgvLNn2g7lAeFzxexPEUfEAezW-iEYok6L-Y5RKKYw"; 
  const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

  let chatHistory = [];

  const SYSTEM_INSTRUCTION = `Ты — ведущий интерактивного квеста. 
Твоя задача — вести увлекательную историю с ветвлением выборов.
Ты ДОЛЖЕН всегда отвечать СТРОГО в формате JSON:
{
  "story": "Текст текущей сцены или реплика персонажа (2-3 предложения)",
  "options": [
    "Первый вариант действия",
    "Второй вариант действия",
    "Третий вариант действия"
  ]
}
Не добавляй никакого другого текста, кроме JSON. Выдавай от 2 до 4 вариантов ответа.`;

  async function sendToGemini(userChoiceText = null) {
    const storyElem = document.getElementById("story-text");
    const optionsElem = document.getElementById("options-container");

    optionsElem.innerHTML = `<div class="loader">ИИ генерирует продолжение...</div>`;

    if (userChoiceText) {
      chatHistory.push({
        role: "user",
        parts: [{ text: `Я выбираю: "${userChoiceText}"` }]
      });
    }

    const requestBody = {
      systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
      contents: chatHistory.length === 0 
        ? [{ role: "user", parts: [{ text: "Начни новую историю в жанре интерактивного детектива или сай-фая." }] }] 
        : chatHistory,
      generationConfig: { responseMimeType: "application/json" }
    };

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestBody)
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      const rawText = data.candidates[0].content.parts[0].text;
      
      chatHistory.push({ role: "model", parts: [{ text: rawText }] });

      const parsedData = JSON.parse(rawText);
      renderScene(parsedData.story, parsedData.options);

    } catch (error) {
      console.error(error);
      storyElem.innerText = " Ошибка загрузки данных. Проверь ключ или подключение к сети.";
      optionsElem.innerHTML = "";
    }
  }

  function renderScene(storyText, options) {
    document.getElementById("story-text").innerText = storyText;
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    options.forEach(optionText => {
      const btn = document.createElement("button");
      btn.className = "btn-option";
      btn.innerText = optionText;
      btn.onclick = () => {
        // Легкая вибрация при клике (работает в Telegram на мобильных)
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        sendToGemini(optionText);
      };
      optionsContainer.appendChild(btn);
    });
  }

  function resetStory() {
    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    chatHistory = [];
    sendToGemini();
  }

  // Первый запуск
  sendToGemini();
</script>

</body>
</html>
